<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="gallery-container">
    <img id="featured" class="main-img" src="https://picsum.photos/id/10/400/400" alt="Featured Image">
    
    <div class="thumbnail-container">
        <img class="thumb-img" src="https://picsum.photos/id/10/400/400" onclick="changeImage(this.src)">
        <img class="thumb-img" src="https://picsum.photos/id/20/400/400" onclick="changeImage(this.src)">
        <img class="thumb-img" src="https://picsum.photos/id/30/400/400" onclick="changeImage(this.src)">
        <img class="thumb-img" src="https://picsum.photos/id/40/400/400" onclick="changeImage(this.src)">
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
